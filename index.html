 for(let i=0;i<A.time.length;i++){if(A.time[i].slice(0,10)<TODAY)continue;const t=A.time[i],jw=W?W.time.indexOf(t):-1,jl=L?L.time.indexOf(t):-1,l=jl>=0?lv[jl]:null,p=jl>0?lv[jl-1]:null,x=jl>=0?lv[jl+1]:null;
  const base={time:t,ts:+t.slice(11,13),d:t.slice(0,10),lvl:l,r48:r48[i],sst:(jl>=0&&L.sea_surface_temperature?L.sea_surface_temperature[jl]:null),stage:p!=null&&x!=null&&l!=null?(x>p?'rising':'falling'):null};

  const hs=MODS.map(m=>per[m.id][per[m.id].length-1]),vals=k=>hs.map(h=>h[k]).filter(z=>z!=null),avg=k=>{const v=vals(k);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null},

function dsum(H,d){const hs=H.filter(h=>h.d===d),pw=hs.filter(h=>h.ts>=S.h1&&h.ts<=S.h2);if(pw.length<3)return null;let best=null;

 return hd+`<div class="card sc"><b>${dlab}</b> <span class="mu">· averages over your fishing hours (${hh(S.h1)}–${hh(S.h2)})</span><table style="margin-top:6px"><tr><th></th>${CMP.map(r=>`<th>${r.b.name}${r.sel&&r.sel.bs===best&&ok.length>1?'<br><span class="g">★ best</span>':''}</th>`).join('')}</tr>${R.map(([n,fn])=>`<tr><td class="mu">${n}</td>${CMP.map(r=>`<td>${r.sel?fn(r):'<span class="r">No data</span>'}</td>`).join('')}</tr>`).join('')}</table>
 <p class="mu">Pressure change = forecast pressure at the end of your fishing hours minus the start. Day score is the same score shown on the day buttons (best 3-hour window); whole-day average covers every fishing hour. A beach with missing data is never ranked best. Use the day buttons at the top to change the day.</p></div>`}
function sets(){const w=S.w;return`${look()}<div class="card"><label>Wind limit (km/h)</label><input id="s_wind" type="number" value="${S.wind}"><label>Swell limit (m)</label><input id="s_swell" type="number" step=".1" value="${S.swell}">
 <label>Fishing hours from / to</label><input id="s_h1" type="number" value="${S.h1}" style="width:80px"> <input id="s_h2" type="number" value="${S.h2}" style="width:80px">
 <label>Preferred tide stage</label><select id="s_tide">${['any','rising','falling'].map(t=>`<option ${S.tide===t?'selected':''}>${t}</option>`).join('')}</select>
 <label>Forecast days (3-7)</label><input id="s_dur" type="number" min="3" max="7" value="${S.dur}"><label>Score weights (swell, wind, wind direction, swell period, tide, weather, pressure)</label>
 ${Object.keys(w).map(k=>`<input id="w_${k}" type="number" value="${w[k]}" style="width:60px" title="${k}">`).join(' ')}<p><button class="p" onclick="sv()">Save</button> <button onclick="S=Object.assign({},DS);save();go(1)">Reset</button></p></div>
 <div class="card"><b>App</b><p class="mu">Version ${VER}</p><button id="ib" class="p" style="display:none" onclick="inst()">Install app</button> <button onclick="upd()">Check for update</button><p class="mu" id="ios"></p></div>`}
const TH={ocean:{bg:'#06151d',card:'#0d2430',line:'#1b3a49',tx:'#e6f1ef',mu:'#8fb0b8',am:'#e8b86a',co:'#e5654f',gd:'#3ccf91'},dark:{bg:'#0b0b0d',card:'#17171a',line:'#2a2a2f',tx:'#eeeeee',mu:'#9a9aa5',am:'#e8b86a',co:'#e5654f',gd:'#3ccf91'},light:{bg:'#f2f6f7',card:'#ffffff',line:'#d3dfe2',tx:'#0f2027',mu:'#53707a',am:'#a8650b',co:'#c0392b',gd:'#1f8f5f'}};
function applyTheme(){const t=TH[S.theme]||TH.ocean,r=document.documentElement.style;for(const k in t)r.setProperty('--'+k,t[k]);r.setProperty('--ac',S.accent);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg}
function look(){const A=['#2fb8a6','#4aa3ff','#e8b86a','#ff7a6b','#a78bfa'],T={ocean:'Ocean',dark:'Dark',light:'Light'};return`<div class="card"><b>Look</b><label>Theme</label><div class="tabs">${Object.keys(T).map(k=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';save();applyTheme();go()">${T[k]}</button>`).join('')}</div><label>Accent colour</label><div style="display:flex;gap:10px">${A.map(c=>`<button aria-label="Accent ${c}" onclick="S.accent='${c}';save();applyTheme();go()" style="width:38px;height:38px;border-radius:50%;background:${c};border:3px solid ${S.accent===c?'var(--tx)':'transparent'}"></button>`).join('')}</div></div>`}
function sv(){S.wind=+$('s_wind').value;S.swell=+$('s_swell').value;S.h1=+$('s_h1').value;S.h2=+$('s_h2').value;S.tide=$('s_tide').value;S.dur=Math.min(7,Math.max(3,+$('s_dur').value));for(const k in S.w)S.w[k]=+$('w_'+k).value;save();toast('Saved');if(D){const B=build(D.raw);D.H=B.H;D.M=B.M}CMP=null;FISH=null;go(1)}
async function inst(){if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('ib').style.display='none'}
async function upd(){const r=await navigator.serviceWorker?.getRegistration();if(!r)return toast('Updates work once installed from the web');await r.update();const w=r.installing||r.waiting;if(!w)return toast('You have the latest version');const go=()=>w.postMessage('skip');w.state==='installed'?go():w.addEventListener('statechange',()=>w.state==='installed'&&go());toast('Updating…')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=$('ib');if(b)b.style.display='inline-block'});
let DS_=[];
function go(re){const ds=D?days(D.H).map(d=>dsum(D.H,d)).filter(Boolean):[];DS_=ds;
 $('days').innerHTML=ds.map((s,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};CMP=null;go()">${dl(s.d)}<br><b class="${rc(s.best.s)}">${s.best.s}</b></button>`).join('');
 $('v').innerHTML=!D?'<div class="card mu">Loading forecast…</div>':tab==='Dashboard'?dash(ds,D.raw)+(D.raw.stale?'<div class="a">Offline: showing last saved data.</div>':''):tab==='Forecast'?fc(ds):tab==='Compare'?cmpv():tab==='Fish'?fishv():tab==='Tides'?tides(ds):sets();
 $('nav').innerHTML=['Dashboard','Forecast','Fish','Compare','Settings'].map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';go()">${t}</button>`).join('');
 $('fn').style.display=tab==='Dashboard'?'none':'';$('fav').textContent=S.fav.includes(beach.id)?'★':'☆';
 if(tab==='Fish'&&!FISH&&D&&!fishBusy){fishBusy=1;fish().then(()=>{fishBusy=0;go()})}
 if(tab==='Compare'&&!CMP&&D&&!cmpBusy){cmpBusy=1;cmp().then(()=>{cmpBusy=0;go()})}
 if(tab==='Settings'){$('ios').textContent=/iphone|ipad/i.test(navigator.userAgent)?'On iPhone: tap Share → Add to Home Screen.':'';if(ip)$('ib').style.display='inline-block'}}
async function refresh(){D=null;go();try{const raw=await load(beach),B=build(raw);D={raw,H:B.H,M:B.M};if(day>=days(D.H).length)day=0}catch(e){$('v').innerHTML=`<div class="card r">Could not load data (${e.message}). Check your connection and try again. <button onclick="refresh()">Retry</button></div>`;return}go()}
$('bs').innerHTML=[...new Set(BL.map(b=>b.reg))].map(r=>`<optgroup label="${r}">${BL.filter(b=>b.reg===r).map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</optgroup>`).join('');$('bs').value=beach.id;
$('bs').onchange=e=>{beach=BL.find(b=>b.id===e.target.value);S.def=beach.id;save();CMP=null;FISH=null;refresh()};
$('fav').onclick=()=>{const i=S.fav.indexOf(beach.id);i<0?S.fav.push(beach.id):S.fav.splice(i,1);save();CMP=null;FISH=null;go()};
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js');navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
applyTheme();refresh();setInterval(()=>{if(!document.hidden)refresh()},30*60000);
</script></body></html>
