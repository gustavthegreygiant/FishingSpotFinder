 const cap=wd==null?'Wind direction N/A.':`${f(c.ws,' km/h',0)} from the ${cp(wd)} — <b>${k}</b>. ${k==='onshore'?'Blowing from the sea onto the beach: rougher surf, harder casting.':k==='offshore'?'Blowing off the land out to sea: cleaner water, often easier casting.':'Blowing along the beach.'}`;
 return`<div class="card"><b>Wind at ${beach.name}</b><svg viewBox="0 0 200 200" width="230" style="display:block;margin:6px auto" role="img" aria-label="Wind ${cp(wd)} at ${beach.name}, ${k||'unknown'}"><defs><clipPath id="wc"><circle cx="100" cy="100" r="90"/></clipPath></defs><g clip-path="url(#wc)"><g transform="rotate(${fa} 100 100)"><rect x="0" y="0" width="200" height="100" style="fill:var(--ac);fill-opacity:.28"/><rect x="0" y="100" width="200" height="100" fill="#c9a66b" fill-opacity=".28"/><line x1="0" y1="100" x2="200" y2="100" stroke="#e8b86a" stroke-width="3"/></g></g><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="2"/>
 <g font-size="11" text-anchor="middle" fill="var(--mu)"><text x="100" y="13">N</text><text x="190" y="104">E</text><text x="100" y="196">S</text><text x="10" y="104">W</text></g><text x="${sx}" y="${sy}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ac)">SEA</text><text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="#c9a66b">LAND</text>
 ${wd==null?'':`<g transform="rotate(${wd+180} 100 100)"><line x1="100" y1="148" x2="100" y2="60" stroke="var(--tx)" stroke-width="5" stroke-linecap="round"/><path d="M100 44L87 68H113Z" fill="var(--tx)"/></g>`}</svg>
 <p style="text-align:center">${cap}</p><div class="mu" style="text-align:center;font-size:12px">Arrow shows where the wind is heading. Hourly wind (km/h):</div><div style="display:flex;justify-content:space-around;margin-top:6px">${slots}</div></div>`}
function provs(c,raw){const age=Math.round((Date.now()-raw.t)/60000),cols=MODS.map(m=>D.M[m.id].find(h=>h.time===c.time)||{}),N=['US','Europe','Germany'],
 rg=(k,u)=>{const v=cols.map(h=>h[k]).filter(x=>x!=null);return v.length?(Math.round(Math.min(...v))===Math.round(Math.max(...v))?f(v[0],u,0):f(Math.min(...v),'',0)+'–'+f(Math.max(...v),u,0)):'N/A'},
 R=[['Wind km/h',h=>h.ws==null?'N/A':`${f(h.ws,'',0)} ${cp(h.wd)}`],['Gusts km/h',h=>f(h.wg,'',0)],['Wave height m',h=>f(h.wh)],['Wave period s',h=>f(h.wp,'',0)],['Pressure hPa',h=>f(h.pr,'',0)],['Temp °C',h=>f(h.T,'',0)],['Rain mm',h=>f(h.rain)]];
 return`<div class="card"><b>Do the forecasts agree?</b><p>${c.dis?'<span class="a">Not really — treat this with caution.</span>':'<span class="g">Yes, broadly.</span>'} We check three separate forecasts (US, European and German weather services) and use their average.</p>
 ${[['Wind',rg('ws',' km/h')],['Gusts',rg('wg',' km/h')],['Wave height',rg('wh',' m')],['Pressure',rg('pr',' hPa')]].map(([a,x])=>`<div class="row"><span class="mu">${a} (range)</span><span>${x}</span></div>`).join('')}
 <details style="margin-top:8px"><summary class="mu">See each forecast</summary><div class="sc"><table><tr><th></th>${N.map(n=>`<th>${n}</th>`).join('')}<th>Average</th></tr>${R.map(([n,fn])=>`<tr><td>${n}</td>${cols.map(h=>`<td>${fn(h)}</td>`).join('')}<td><b>${fn(c)}</b></td></tr>`).join('')}</table></div></details>
 <p class="mu">Forecasts, not measurements. Updated ${age} min ago${raw.stale?' (offline copy)':''}. Wave forecasts are coarse near the coast — treat them as a guide.</p></div>`}
function fc(ds){const p=patterns(ds);return ds.map((s,i)=>`<div class="card" onclick="day=${i};tab='Dashboard';go()" style="cursor:pointer"><div class="row" style="border:0"><b>${dl(s.d)}</b><b class="${rc(s.best.s)}">${s.best.s} · ${rate(s.best.s)}</b></div>
 <div class="mu">Best ${hh(s.best.from)}–${hh(s.best.to)} · wind ${f(s.avgW,'',0)} avg / ${f(s.maxW,'',0)} max, gusts ${f(s.maxG,'',0)} km/h · swell ${s.maxS<0?'N/A':f(s.maxS,' m')} max · pressure ${pdtxt(s.pd)} · rain ${s.pop}% · confidence ${s.conf}%</div></div>`).join('')
 +`<div class="card"><b>Wind timeline &amp; pattern insights</b><div class="sc"><table><tr>${p.c.map(c=>`<td>${dl(c.d)}<br>${arrow(c.dir)} ${cp(c.dir)}<br><span class="mu">${f(c.sp,'',0)} km/h<br>${c.k}</span></td>`).join('')}</tr></table></div>${p.o.length?p.o.map(x=>`<p>${x}</p>`).join(''):'<p class="mu">No significant wind shifts in this period.</p>'}</div>`}
function tides(ds){const s=ds[day];if(!s)return'';const pts=s.hs.filter(h=>h.lvl!=null);if(!pts.length)return'<div class="card">No tide data.</div>';const mn=Math.min(...pts.map(h=>h.lvl)),mx=Math.max(...pts.map(h=>h.lvl));
 const pl=pts.map(h=>`${h.ts*12+10},${100-(h.lvl-mn)/(mx-mn||1)*80}`).join(' ');
 return`<div class="card"><b>Tide — ${dl(s.d)}</b><svg viewBox="0 0 300 110" width="100%" role="img" aria-label="Tide height graph"><polyline points="${pl}" fill="none" stroke="#2fb8a6" stroke-width="2"/></svg><div class="mu" style="display:flex;justify-content:space-between"><span>00:00</span><span>12:00</span><span>24:00</span></div>
 ${s.tide.map(x=>`<div class="row"><span>${x.k}</span><span>${x.h.time.slice(11,16)} · ${f(x.h.lvl,' m',2)}</span></div>`).join('')}
 <p class="mu">Modelled sea level (Open-Meteo, ~8 km grid, includes tides) at the nearest ocean point — an approximation, <b>not</b> official station predictions. Times are to the nearest hour. For fishing decisions confirm with SA Navy Hydrographic Office tables.</p></div>`}
let cmpBusy=0;
function ensureCmp(){S.cmp=(S.cmp||[]).filter(id=>BL.some(b=>b.id===id));if(S.cmp.length<2){const d=b=>(b.lat-beach.lat)**2+(b.lon-beach.lon)**2;S.cmp=[beach.id,...BL.filter(b=>b.id!==beach.id).sort((x,y)=>d(x)-d(y)).slice(0,2).map(b=>b.id)];save()}}
async function cmp(){ensureCmp();CMP=await Promise.all(S.cmp.slice(0,3).map(async id=>{const b=BL.find(x=>x.id===id);try{const raw=await load(b),sv=beach;beach=b;const H=build(raw).H;beach=sv;
 const stat=d=>{const hs=H.filter(h=>h.d===d&&h.ts>=S.h1&&h.ts<=S.h2);if(!hs.length)return null;const av=g=>{const v=hs.map(g).filter(x=>x!=null);return v.length?v.reduce((p,q)=>p+q,0)/v.length:null};let sx=0,sy=0;hs.forEach(h=>{if(h.wd!=null){sx+=Math.sin(h.wd*Math.PI/180);sy+=Math.cos(h.wd*Math.PI/180)}});
  return{sc:av(h=>h.sc.s),ws:av(h=>h.ws),wd:(Math.atan2(sx,sy)*180/Math.PI+360)%360,wg:Math.max(...hs.map(h=>h.wg||0)),wh:av(h=>h.wh),pr:av(h=>h.pr),pd:hs[0].pd,T:av(h=>h.T),pop:Math.max(...hs.map(h=>h.pop||0)),conf:Math.min(...hs.map(h=>h.sc.conf)),dis:hs.some(h=>h.dis)}};
 const ds=days(H),all=ds.map(stat).filter(Boolean);return{b,sel:stat(ds[day]),wk:all.length?all.reduce((p,x)=>p+x.sc,0)/all.length:null}}catch{return{b,sel:null,wk:null}}}))}
function cmpv(){ensureCmp();const sel=[0,1,2].map(i=>`<select aria-label="Beach ${i+1}" onchange="S.cmp[${i}]=this.value;S.cmp=S.cmp.filter(Boolean);save();CMP=null;go()" style="width:100%;margin-bottom:6px">${i===2?'<option value="">— none —</option>':''}${BL.map(b=>`<option value="${b.id}" ${S.cmp[i]===b.id?'selected':''}>${b.name}</option>`).join('')}</select>`).join('');
 const hd=`<div class="card"><b>Compare beaches</b> <span class="mu">pick 2 or 3</span><div style="margin-top:8px">${sel}</div></div>`;
 if(!CMP)return hd+'<div class="card mu">Comparing beaches…</div>';
 const ok=CMP.filter(r=>r.sel),best=ok.length?Math.max(...ok.map(r=>r.sel.sc)):null,dlab=D?dl(days(D.H)[day]):'',R=[
 ['Average score',r=>`<b class="${rc(r.sel.sc)}" style="font-size:20px">${Math.round(r.sel.sc)}</b><br><span class="mu">${rate(r.sel.sc)}</span>`],
 ['7-day average',r=>r.wk==null?'N/A':`<b>${Math.round(r.wk)}</b>`],
 ['Wind',r=>`${f(r.sel.ws,' km/h',0)} ${cp(r.sel.wd)}<br><span class="mu">${rel(r.sel.wd,r.b.face)||''}</span>`],
 ['Max gusts',r=>f(r.sel.wg,' km/h',0)],['Waves',r=>f(r.sel.wh,' m')],['Pressure now',r=>f(r.sel.pr,' hPa',0)],['Pressure change',r=>r.sel.pd==null?'N/A':`${r.sel.pd>0?'+':''}${f(r.sel.pd,' hPa',1)}<br><span class="mu">${Math.abs(r.sel.pd)<1.5?'steady':r.sel.pd<0?'falling':'rising'}</span>`],['Pressure score',r=>r.sel.pd==null?'N/A':`<b class="${rc(pS(r.sel.pd))}">${pS(r.sel.pd)}</b>`],['Air temp',r=>f(r.sel.T,'°C',0)],['Rain chance',r=>r.sel.pop+'%'],
 ['Confidence',r=>r.sel.conf+'%'+(r.sel.dis?'<br><span class="a">models differ</span>':'')]];
 return hd+`<div class="card sc"><b>${dlab}</b> <span class="mu">· averages over your fishing hours (${hh(S.h1)}–${hh(S.h2)})</span><table style="margin-top:6px"><tr><th></th>${CMP.map(r=>`<th>${r.b.name}${r.sel&&r.sel.sc===best&&ok.length>1?'<br><span class="g">★ best</span>':''}</th>`).join('')}</tr>${R.map(([n,fn])=>`<tr><td class="mu">${n}</td>${CMP.map(r=>`<td>${r.sel?fn(r):'<span class="r">No data</span>'}</td>`).join('')}</tr>`).join('')}</table>
 <p class="mu">Pressure change = forecast pressure at the end of your fishing hours minus the start. Scores average every fishing hour of the day, so they're lower than a "best window" score. A beach with missing data is never ranked best. Use the day buttons at the top to change the day.</p></div>`}
function sets(){const w=S.w;return`${look()}<div class="card"><label>Wind limit (km/h)</label><input id="s_wind" type="number" value="${S.wind}"><label>Swell limit (m)</label><input id="s_swell" type="number" step=".1" value="${S.swell}">
 <label>Fishing hours from / to</label><input id="s_h1" type="number" value="${S.h1}" style="width:80px"> <input id="s_h2" type="number" value="${S.h2}" style="width:80px">
 <label>Preferred tide stage</label><select id="s_tide">${['any','rising','falling'].map(t=>`<option ${S.tide===t?'selected':''}>${t}</option>`).join('')}</select>
 <label>Forecast days (3-7)</label><input id="s_dur" type="number" min="3" max="7" value="${S.dur}"><label>Score weights (swell, wind, wind direction, swell period, tide, weather, pressure)</label>
 ${Object.keys(w).map(k=>`<input id="w_${k}" type="number" value="${w[k]}" style="width:60px" title="${k}">`).join(' ')}<p><button class="p" onclick="sv()">Save</button> <button onclick="S=Object.assign({},DS);save();go(1)">Reset</button></p></div>
 <div class="card"><b>App</b><p class="mu">Version ${VER}</p><button id="ib" class="p" style="display:none" onclick="inst()">Install app</button> <button onclick="upd()">Check for update</button><p class="mu" id="ios"></p></div>`}
const TH={ocean:{bg:'#06151d',card:'#0d2430',line:'#1b3a49',tx:'#e6f1ef',mu:'#8fb0b8',am:'#e8b86a',co:'#e5654f',gd:'#3ccf91'},dark:{bg:'#0b0b0d',card:'#17171a',line:'#2a2a2f',tx:'#eeeeee',mu:'#9a9aa5',am:'#e8b86a',co:'#e5654f',gd:'#3ccf91'},light:{bg:'#f2f6f7',card:'#ffffff',line:'#d3dfe2',tx:'#0f2027',mu:'#53707a',am:'#a8650b',co:'#c0392b',gd:'#1f8f5f'}};
function applyTheme(){const t=TH[S.theme]||TH.ocean,r=document.documentElement.style;for(const k in t)r.setProperty('--'+k,t[k]);r.setProperty('--ac',S.accent);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg}
function look(){const A=['#2fb8a6','#4aa3ff','#e8b86a','#ff7a6b','#a78bfa'],T={ocean:'Ocean',dark:'Dark',light:'Light'};return`<div class="card"><b>Look</b><label>Theme</label><div class="tabs">${Object.keys(T).map(k=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';save();applyTheme();go()">${T[k]}</button>`).join('')}</div><label>Accent colour</label><div style="display:flex;gap:10px">${A.map(c=>`<button aria-label="Accent ${c}" onclick="S.accent='${c}';save();applyTheme();go()" style="width:38px;height:38px;border-radius:50%;background:${c};border:3px solid ${S.accent===c?'var(--tx)':'transparent'}"></button>`).join('')}</div></div>`}
function sv(){S.wind=+$('s_wind').value;S.swell=+$('s_swell').value;S.h1=+$('s_h1').value;S.h2=+$('s_h2').value;S.tide=$('s_tide').value;S.dur=Math.min(7,Math.max(3,+$('s_dur').value));for(const k in S.w)S.w[k]=+$('w_'+k).value;save();toast('Saved');if(D){const B=build(D.raw);D.H=B.H;D.M=B.M}CMP=null;go(1)}
async function inst(){if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('ib').style.display='none'}
async function upd(){const r=await navigator.serviceWorker?.getRegistration();if(!r)return toast('Updates work once installed from the web');await r.update();const w=r.installing||r.waiting;if(!w)return toast('You have the latest version');const go=()=>w.postMessage('skip');w.state==='installed'?go():w.addEventListener('statechange',()=>w.state==='installed'&&go());toast('Updating…')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=$('ib');if(b)b.style.display='inline-block'});
let DS_=[];
function go(re){const ds=D?days(D.H).map(d=>dsum(D.H,d)).filter(Boolean):[];DS_=ds;
 $('days').innerHTML=ds.map((s,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};CMP=null;go()">${dl(s.d)}<br><b class="${rc(s.best.s)}">${s.best.s}</b></button>`).join('');
 $('v').innerHTML=!D?'<div class="card mu">Loading forecast…</div>':tab==='Dashboard'?dash(ds,D.raw)+(D.raw.stale?'<div class="a">Offline: showing last saved data.</div>':''):tab==='Forecast'?fc(ds):tab==='Compare'?cmpv():tab==='Tides'?tides(ds):sets();
 $('nav').innerHTML=['Dashboard','Forecast','Compare','Tides','Settings'].map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';go()">${t}</button>`).join('');
 $('fav').textContent=S.fav.includes(beach.id)?'★':'☆';
 if(tab==='Compare'&&!CMP&&D&&!cmpBusy){cmpBusy=1;cmp().then(()=>{cmpBusy=0;go()})}
 if(tab==='Settings'){$('ios').textContent=/iphone|ipad/i.test(navigator.userAgent)?'On iPhone: tap Share → Add to Home Screen.':'';if(ip)$('ib').style.display='inline-block'}}
async function refresh(){D=null;go();try{const raw=await load(beach),B=build(raw);D={raw,H:B.H,M:B.M};if(day>=days(D.H).length)day=0}catch(e){$('v').innerHTML=`<div class="card r">Could not load data (${e.message}). Check your connection and try again. <button onclick="refresh()">Retry</button></div>`;return}go()}
$('bs').innerHTML=[...new Set(BL.map(b=>b.reg))].map(r=>`<optgroup label="${r}">${BL.filter(b=>b.reg===r).map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</optgroup>`).join('');$('bs').value=beach.id;
$('bs').onchange=e=>{beach=BL.find(b=>b.id===e.target.value);S.def=beach.id;save();CMP=null;refresh()};
$('fav').onclick=()=>{const i=S.fav.indexOf(beach.id);i<0?S.fav.push(beach.id):S.fav.splice(i,1);save();CMP=null;go()};
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js');navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
applyTheme();refresh();setInterval(()=>{if(!document.hidden)refresh()},30*60000);
</script></body></html>
